[project]
name = "lintdiff"
version = "0.1.0"
description = "Show only changed lint rules between two lint reports."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ProjectCreationAgent", email = "agent@example.com" }]
keywords = ["lint", "diff", "cli", "ruff"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
lintdiff = "lintdiff:main"

[tool.setuptools]
py-modules = ["lintdiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
